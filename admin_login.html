<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #e5e7eb; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 0 10px rgba(0, 0, 0, 0.04); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-white rounded-xl card-shadow">
        <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">Đăng Nhập Quản Trị</h1>
        <p class="text-center text-gray-500 mb-8">Hệ thống quản lý Sweet Cake Shop</p>
        <form action="admin_dashboard.html" method="get" class="space-y-6">
            <div>
                <label for="admin_username" class="block text-sm font-medium text-gray-700 mb-1">Tên Đăng Nhập</label>
                <input type="text" id="admin_username" placeholder="admin_user" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500" required>
            </div>
            <div>
                <label for="admin_password" class="block text-sm font-medium text-gray-700 mb-1">Mật Khẩu</label>
                <input type="password" id="admin_password" placeholder="********" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500" required>
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-full hover:bg-blue-700 transition duration-300 transform hover:scale-[1.01]">
                Đăng Nhập
            </button>
        </form>
        <div class="mt-6 text-center text-sm">
            <a href="index.html" class="font-medium text-blue-600 hover:text-blue-500">
                ← Quay lại Trang bán hàng
            </a>
        </div>
    </div>
</body>
</html>
